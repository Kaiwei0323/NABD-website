# Apache: redirect www.inventecna.com and inventecna.com to https://inventecna.com
# So visitors don't see the default/empty Apache page.
#
# Ubuntu/Debian: put this in /etc/apache2/sites-available/
#   sudo cp apache-inventecna-redirect.conf /etc/apache2/sites-available/inventecna-redirect.conf
#   sudo a2ensite inventecna-redirect
#   sudo systemctl reload apache2

# Redirect HTTP (port 80) to HTTPS at inventecna.com (no www)
<VirtualHost *:80>
    ServerName inventecna.com
    ServerAlias www.inventecna.com
    Redirect permanent / https://inventecna.com/
</VirtualHost>

# Optional: if Apache also listens on 443 and catches https://www.inventecna.com,
# add a second vhost below so https www redirects to https non-www.
# (Only enable if https://www.inventecna.com currently shows Apache instead of your app.)
#
# <VirtualHost *:443>
#     ServerName www.inventecna.com
#     SSLEngine on
#     SSLCertificateFile     /path/to/your/ssl/cert.pem
#     SSLCertificateKeyFile  /path/to/your/ssl/private.key.pem
#     Redirect permanent / https://inventecna.com/
# </VirtualHost>
